<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Test Exercise Loading</title>
</head>
<body>
    <h1>Exercise Loading Test</h1>
    <div id="output"></div>

    <script>
        async function testLoading() {
            const output = document.getElementById('output');

            try {
                // Test 1: Load index.json
                output.innerHTML += '<h2>Test 1: Load index.json</h2>';
                const indexResponse = await fetch('exercises/index.json');
                const indexData = await indexResponse.json();
                output.innerHTML += `<p>✅ Loaded ${indexData.categories.length} categories</p>`;

                // Test 2: Load category.json
                output.innerHTML += '<h2>Test 2: Load 00-fundamentals/category.json</h2>';
                const categoryResponse = await fetch('exercises/00-fundamentals/category.json');
                const categoryData = await categoryResponse.json();
                output.innerHTML += `<p>✅ Loaded category with ${categoryData.topics.length} topics</p>`;

                // Test 3: Load topic.json
                output.innerHTML += '<h2>Test 3: Load 01-first-contact/topic.json</h2>';
                const topicResponse = await fetch('exercises/00-fundamentals/01-first-contact/topic.json');
                const topicData = await topicResponse.json();
                output.innerHTML += `<p>✅ Loaded topic with ${topicData.sections.length} sections</p>`;

                // Test 4: Load section.json
                output.innerHTML += '<h2>Test 4: Load 01-system-boot/section.json</h2>';
                const sectionResponse = await fetch('exercises/00-fundamentals/01-first-contact/01-system-boot/section.json');
                const sectionData = await sectionResponse.json();
                output.innerHTML += `<p>✅ Loaded section with ${sectionData.exercises.length} exercises and ${sectionData.challenges.length} challenges</p>`;
                output.innerHTML += `<pre>${JSON.stringify(sectionData.exercises, null, 2)}</pre>`;

                // Test 5: Load individual exercise
                output.innerHTML += '<h2>Test 5: Load ex-1-1-1.json</h2>';
                const exerciseResponse = await fetch('exercises/00-fundamentals/01-first-contact/01-system-boot/ex-1-1-1.json');
                const exerciseData = await exerciseResponse.json();
                output.innerHTML += `<p>✅ Loaded exercise: ${exerciseData.title}</p>`;

                output.innerHTML += '<h2 style="color: green;">✅ ALL TESTS PASSED</h2>';

            } catch (error) {
                output.innerHTML += `<h2 style="color: red;">❌ ERROR: ${error.message}</h2>`;
                output.innerHTML += `<pre>${error.stack}</pre>`;
            }
        }

        testLoading();
    </script>
</body>
</html>
